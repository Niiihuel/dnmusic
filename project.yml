# Configuración del proyecto Xcode vía XcodeGen.
# Como desarrollamos desde Linux (sin Xcode), el .xcodeproj se genera con:
#     brew install xcodegen && xcodegen generate
# El CI de GitHub Actions también corre `xcodegen generate` antes de compilar.
name: DanyApp
options:
  bundleIdPrefix: com.dany
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    # TODO: poné tu Team ID de Apple Developer (Member Center > Membership).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "10.29.0"
  Lottie:
    url: https://github.com/airbnb/lottie-ios.git
    from: "4.5.0"

targets:
  DanyApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: DanyApp
        excludes:
          - "Support/Info.plist"
          - "Support/GoogleService-Info.example.plist"
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Lottie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dany.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: DanyApp/Support/Info.plist
        TARGETED_DEVICE_FAMILY: "1"  # solo iPhone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
