# Cómo se empaqueta y dónde se publica el escritorio.
#
# La versión no se toca acá: sale de desktop/package.json, y en el CI la
# escribe el tag (ver .github/workflows/escritorio.yml). Es la misma versión
# que electron-updater compara contra el latest.yml del release.

appId: com.nihuel.dnmusic
productName: dnmusic
copyright: © Nihuel

directories:
  output: release
  buildResources: build

# El proceso principal compilado. El bundle web NO va acá: va por
# extraResources, afuera del .asar, que es de donde lo lee protocolo.ts.
files:
  - dist/**/*
  - package.json

extraResources:
  - from: web
    to: app
  # Recursos propios de la ventana: no reutilizar el PNG opaco de la PWA.
  - from: build/icon.png
    to: icons/icon.png
  - from: build/icon.ico
    to: icons/icon.ico
  - from: build/logo.png
    to: icons/logo.png

# El esquema propio, para que «Abrir en la app» desde la web abra ésta.
# Lo declara el instalador —NSIS lo escribe en el registro de Windows, y en
# Linux va al .desktop como MimeType—; la AppImage no instala nada, así que
# ahí lo pide `app.setAsDefaultProtocolClient` en el arranque (main.ts).
protocols:
  - name: dnmusic
    schemes:
      - dnmusic

# El cuerpo del release: las mismas novedades que muestra la app, en markdown.
# Lo escribe scripts/notas-release.mjs antes de empaquetar (el CI lo corre con
# la versión del tag; los scripts de npm lo corren solos).
releaseInfo:
  releaseNotesFile: release-notas.md

publish:
  provider: github
  owner: Niihuel
  repo: dnmusic-releases
  # Sin esto electron-builder publica el release como borrador, y un borrador
  # es invisible para electron-updater: la app no encontraría nunca la
  # actualización y no habría ningún error que lo explicara.
  releaseType: release

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: dnmusic-${version}-instalador.${ext}

nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # Instalador con pasos, no de un solo clic: deja elegir la carpeta y no
  # sorprende con una app que aparece instalada sin haber preguntado nada.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: dnmusic
  # Junto al instalador se publica un .blockmap; con él, la actualización baja
  # solo los bloques que cambiaron en vez de los ~100 MB enteros.
  #
  # Un pedazo de script propio dentro del instalador: ahí se vacía el comentario
  # del acceso directo, que si no aparece como globito al pasar el mouse por el
  # ícono. Va acá afuera y no en `build/` —que es donde electron-builder lo
  # buscaría solo— porque esa carpeta es salida: la llena `traer-web.mjs` con
  # los íconos y `.gitignore` la ignora entera, así que el archivo no llegaría
  # nunca al CI y el instalador publicado saldría con el globito puesto.
  include: installer.nsh

linux:
  icon: build/icon.png
  # Solo AppImage, y no es una preferencia estética: es el único formato que
  # electron-updater sabe reemplazar solo. Un .deb quedaría clavado en la
  # versión con la que se instaló, sin avisarle nada a nadie.
  target:
    - target: AppImage
      arch: [x64]
  category: AudioVideo
  synopsis: Escuchá tu música, armá tus listas y ponete en Jam
  artifactName: dnmusic-${version}-${arch}.${ext}
  # Los tres nombres de Linux tienen que ser el mismo, o el escritorio no
  # relaciona la ventana abierta con el lanzador y la barra de tareas muestra un
  # ícono genérico al lado del de la app:
  #
  #   executableName   el binario. Por defecto sale del `name` del package.json
  #                    —`dnmusic-desktop`—, que no es como se llama la app.
  #   desktopName      de package.json; de ahí saca Electron el app_id/WM_CLASS.
  #   syncDesktopName  hace que el archivo .desktop se llame igual que ese.
  executableName: dnmusic
  syncDesktopName: true
