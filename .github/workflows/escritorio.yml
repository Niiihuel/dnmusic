name: Escritorio — compilar y publicar
run-name: Escritorio · ${{ inputs.version || github.ref_name }} · ${{ github.run_number }}

# EAS se usa para iOS/Android. Electron se empaqueta en runners nativos de
# GitHub Actions; Linux y Windows deben terminar antes de publicar el release.
on:
  push:
    tags: ['escritorio-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a compilar (ej. 1.2.0)'
        required: true
        type: string
      publish:
        description: 'Publicar en GitHub Releases al terminar ambos sistemas'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Una reejecución de la misma versión no debe competir por los mismos assets.
concurrency:
  group: escritorio-${{ github.repository }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  CI: '1'
  EXPO_NO_DOTENV: '1'

jobs:
  validar:
    name: Validar versión y destino
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validar versión
        id: version
        shell: bash
        env:
          ENTRADA: ${{ inputs.version }}
        run: |
          version="${ENTRADA:-${GITHUB_REF_NAME#escritorio-v}}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "✗ '$version' no es una versión. Usá escritorio-v1.2.0 o indicá 1.2.0."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # La misma entrada alimenta las novedades dentro de la app y las notas
      # de GitHub; detectarla ahora evita compilar dos sistemas en vano.
      - name: Validar notas del release
        working-directory: desktop
        run: node scripts/notas-release.mjs "${{ steps.version.outputs.version }}"

      # Las EXPO_PUBLIC_* se hornean en dist. Un bundle sin estos valores
      # compilaría, pero dejaría un instalador inutilizable.
      - name: Validar secrets y endpoints
        shell: bash
        env:
          URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          ANON: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          MUSICA: ${{ secrets.EXPO_PUBLIC_MUSIC_API }}
          TOKEN: ${{ secrets.RELEASES_TOKEN }}
          PUBLICAR: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          faltan=''
          [ -n "$URL" ]    || faltan="$faltan EXPO_PUBLIC_SUPABASE_URL"
          [ -n "$ANON" ]   || faltan="$faltan EXPO_PUBLIC_SUPABASE_ANON_KEY"
          [ -n "$MUSICA" ] || faltan="$faltan EXPO_PUBLIC_MUSIC_API"
          if [ "$PUBLICAR" = true ]; then
            [ -n "$TOKEN" ] || faltan="$faltan RELEASES_TOKEN"
          fi
          if [ -n "$faltan" ]; then
            echo "✗ Faltan valores en los secrets:$faltan"
            exit 1
          fi
          if [ "$URL" != 'https://envoy-production-2fb6.up.railway.app' ]; then
            echo '✗ EXPO_PUBLIC_SUPABASE_URL no apunta al Auth de producción.'
            exit 1
          fi
          if [ "$MUSICA" != 'https://dnmusic-production-c3f4.up.railway.app' ]; then
            echo '✗ EXPO_PUBLIC_MUSIC_API no apunta a la API de producción.'
            exit 1
          fi

      - name: Verificar servicio de música para publicar
        if: ${{ github.event_name == 'push' || inputs.publish }}
        env:
          EXPO_PUBLIC_MUSIC_API: ${{ secrets.EXPO_PUBLIC_MUSIC_API }}
        run: node desktop/scripts/verificar-servicio.mjs

      # Nunca volver a subir assets de una versión ya pública. Sí se permite
      # reejecutar contra un borrador dejado por un build fallido.
      - name: Verificar release existente
        if: ${{ github.event_name == 'push' || inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh api repos/Niihuel/dnmusic-releases --jq .full_name > /dev/null
          if gh release view "v$VERSION" --repo Niihuel/dnmusic-releases --json isDraft --jq .isDraft > release-existente.txt 2>/dev/null; then
            if [ "$(cat release-existente.txt)" != true ]; then
              echo "✗ v$VERSION ya es público; usá una versión nueva."
              exit 1
            fi
            echo "Se completará el borrador v$VERSION."
          else
            echo "Se creará el borrador v$VERSION."
          fi

  compilar:
    name: ${{ matrix.nombre }}
    needs: validar
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Ambos electron-builder escriben en el mismo release; serializarlos
      # evita una carrera al crear el borrador.
      max-parallel: 1
      matrix:
        include:
          - nombre: Linux (AppImage)
            os: ubuntu-24.04
            plataforma: --linux
            archivo: dnmusic-${{ needs.validar.outputs.version }}-x86_64.AppImage
          - nombre: Windows (NSIS)
            os: windows-2022
            plataforma: --win
            archivo: dnmusic-${{ needs.validar.outputs.version }}-instalador.exe

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Dependencias de la app
        run: npm ci

      - name: Tipos de la app
        run: npm run typecheck

      - name: Export web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_MUSIC_API: ${{ secrets.EXPO_PUBLIC_MUSIC_API }}
          EXPO_PUBLIC_SITE_URL: https://dnmusic-production-c3f4.up.railway.app
          SITE_URL: https://dnmusic-production-c3f4.up.railway.app
        run: npm run build:web

      - name: Dependencias del escritorio
        working-directory: desktop
        run: npm ci

      - name: Fijar la versión
        working-directory: desktop
        run: npm version "${{ needs.validar.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Compilar y probar el proceso principal
        working-directory: desktop
        run: npm test

      - name: Traer la web y el ícono
        working-directory: desktop
        run: npm run traer-web

      - name: Notas del release
        working-directory: desktop
        run: node scripts/notas-release.mjs "${{ needs.validar.outputs.version }}"

      # electron-builder genera latest.yml/latest-linux.yml solamente al
      # publicar. EP_DRAFT deja ambos sistemas en un release invisible para
      # electron-updater hasta que el trabajo finalizar lo haga público.
      - name: Empaquetar y preparar borrador
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          EP_DRAFT: ${{ github.event_name == 'push' || inputs.publish }}
          PUBLICAR: ${{ github.event_name == 'push' || inputs.publish }}
          PLATAFORMA: ${{ matrix.plataforma }}
        shell: bash
        run: |
          if [ "$PUBLICAR" = true ]; then
            npx electron-builder "$PLATAFORMA" --publish always
          else
            npx electron-builder "$PLATAFORMA" --publish never
          fi

      - name: Verificar instalador
        env:
          ARCHIVO: ${{ matrix.archivo }}
        shell: bash
        run: |
          if [ ! -s "desktop/release/$ARCHIVO" ]; then
            echo "✗ No se generó desktop/release/$ARCHIVO"
            exit 1
          fi

      - name: Guardar instaladores y metadatos
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dnmusic-desktop-${{ matrix.os }}-${{ needs.validar.outputs.version }}
          path: |
            desktop/release/*.AppImage
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  finalizar:
    name: Publicar release completo
    if: ${{ github.event_name == 'push' || inputs.publish }}
    needs: [validar, compilar]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verificar assets y publicar
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ needs.validar.outputs.version }}
        shell: bash
        run: |
          gh release view "v$VERSION" --repo Niihuel/dnmusic-releases --json isDraft,assets > release.json
          node <<'NODE'
          const fs = require('node:fs')
          const version = process.env.VERSION
          const release = JSON.parse(fs.readFileSync('release.json', 'utf8'))
          if (!release.isDraft) {
            console.error(`✗ v${version} ya es público; no se modificarán sus assets.`)
            process.exit(1)
          }
          const assets = new Map(release.assets.map((asset) => [asset.name, asset.size]))
          const required = [
            `dnmusic-${version}-x86_64.AppImage`,
            `dnmusic-${version}-instalador.exe`,
            'latest-linux.yml',
            'latest.yml',
          ]
          const missing = required.filter((name) => !assets.has(name) || assets.get(name) <= 0)
          if (missing.length) {
            console.error(`✗ Faltan assets para publicar: ${missing.join(', ')}`)
            process.exit(1)
          }
          console.log(`✓ v${version} tiene instaladores y metadatos de ambos sistemas.`)
          NODE
          gh release edit "v$VERSION" --repo Niihuel/dnmusic-releases --draft=false
          echo "✓ v$VERSION publicado en Niihuel/dnmusic-releases" >> "$GITHUB_STEP_SUMMARY"
