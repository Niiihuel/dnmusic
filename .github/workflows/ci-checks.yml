name: CI Checks

# Compilación rápida SIN firma en simulador, para feedback al abrir un PR.
# No consume certificados ni sube nada.
on:
  pull_request:
    branches: [main]

jobs:
  compile-check:
    name: Build for simulator (no sign)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Use placeholder GoogleService-Info.plist (solo para compilar)
        run: cp DanyApp/Support/GoogleService-Info.example.plist DanyApp/Support/GoogleService-Info.plist

      - name: Resolve SPM & build for simulator
        run: |
          set -o pipefail
          xcodebuild -project DanyApp.xcodeproj \
            -scheme DanyApp \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty
