name: CI Checks

# Tipos y lint de la app y del servicio de música, al abrir un PR.
#
# Antes esto compilaba el scaffold Swift en un runner macOS: costaba 10× en
# minutos y verificaba una app que ya no es la que usamos. Los chequeos que
# sirven hoy corren en Linux y en menos de un minuto.
on:
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Types & lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install deps
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix desktop ci --ignore-scripts

      - name: Types
        run: npx tsc --noEmit

      - name: Music service — types
        working-directory: server
        run: npm test

      # `--ignore-scripts` saltea el postinstall de Electron, que baja ~100 MB
      # de binario. Los tipos vienen en el paquete de npm, así que para chequear
      # no hace falta: el binario recién importa al empaquetar.
      - name: Escritorio — types
        working-directory: desktop
        run: npm test

      # Las pruebas del servicio importan su salida dist: compilar antes del lint.
      - name: Lint
        run: npx eslint .

      - name: App tests
        run: node --test tests/*.test.mjs
