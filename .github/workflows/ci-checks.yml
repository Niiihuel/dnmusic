name: CI Checks

on:
  push:
    branches: [production]
  pull_request:
    branches: [main, production]

permissions:
  contents: read

jobs:
  checks:
    name: Types & lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REQUIRE_EQ_DSP_TEST: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install deps
        run: |
          npm ci
          npm --prefix server ci
          # Los tests de escritorio no necesitan descargar el binario Electron.
          npm --prefix desktop ci --ignore-scripts

      - name: Types, tests & lint
        run: npm run check

      - name: Message permissions — PostgreSQL
        run: |
          docker pull postgres:17
          RUN_MESSAGE_DB_TESTS=1 node --test tests/message-actions-db.test.mjs
