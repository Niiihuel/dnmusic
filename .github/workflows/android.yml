name: Android — desarrollo
run-name: Android · development · ${{ github.run_number }}
on:
  push:
    branches: ['codex/**']
    paths:
      - 'modules/android-controls/**'
      - 'src/ui/*.android.tsx'
      - 'src/ui/AndroidHost.tsx'
      - 'src/ui/AndroidIcon.tsx'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-development-${{ github.repository }}
  cancel-in-progress: false
jobs:
  compilar:
    name: Compilar APK de desarrollo
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_DOTENV: '1'
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Usar el JDK y SDK del runner
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_17_X64/bin/java" -version
          test -d "$ANDROID_HOME"
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar Android
        run: |
          npm run typecheck
          node --test tests/android-*.test.mjs
      - name: Generar proyecto Android
        run: npx expo prebuild --platform android --no-install
      - name: Compilar Kotlin y APK
        working-directory: android
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a,x86_64 --max-workers=2
      - name: Guardar APK de desarrollo
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dnmusic-android-development
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Resumen
        run: |
          echo 'APK de desarrollo con Compose y Kotlin compilados. Instalar con adb install -r app-debug.apk y ejecutar npm run android:dev.' >> "$GITHUB_STEP_SUMMARY"
