name: iOS — compilar
run-name: iOS · ${{ inputs.profile }} · ${{ github.run_number }}

# Compila en el Mac de GitHub con EAS local, sin consumir builds de EAS Cloud.
# Instrucciones y secretos: docs/BUILD-IOS-GITHUB.md
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'production: TestFlight/App Store; preview: iPhones registrados'
        type: choice
        options: [production, preview]
        default: production
        required: true
      testflight:
        description: 'Subir a TestFlight al terminar (sólo production)'
        type: boolean
        default: false

      ipa_release:
        description: 'Opcional: reenviar un IPA production guardado (ios-build-ID-INTENTO), sin recompilar'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.repository }}
  cancel-in-progress: false

env:
  CI: '1'
  EXPO_NO_DOTENV: '1'

jobs:
  validar:
    name: Comprobar configuración
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Probar validación de credenciales
        run: node --test tests/ios-ci.test.mjs
      - name: Validar secretos antes de gastar minutos de macOS
        env:
          IOS_PROFILE: ${{ inputs.profile }}
          IPA_RELEASE: ${{ inputs.ipa_release }}
          SUBMIT_TESTFLIGHT: ${{ inputs.testflight }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: node scripts/ci/ios.mjs check
      - name: Instalar dependencias y parches nativos
        run: npm ci
      - name: Verificar app y parche de audio antes de usar macOS
        run: |
          npm run typecheck
          node --test tests/expo-audio-patch.test.mjs

  compilar:
    name: Compilar IPA en macOS
    needs: validar
    if: ${{ !inputs.ipa_release }}
    permissions:
      contents: write # Permite guardar el IPA en un borrador privado si falta cupo de artifacts.
    outputs:
      ipa-storage: ${{ steps.storage.outputs.kind }}
      ipa-release: ${{ steps.storage.outputs.release }}
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # Los certificados y capacidades se preparan una vez con eas credentials.
      EXPO_NO_CAPABILITY_SYNC: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: '24.3.0'
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Verificar herramientas nativas
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          pod --version
          fastlane --version
      - name: Instalar dependencias y parches nativos
        run: npm ci
      - name: Compilar en este runner
        env:
          IOS_PROFILE: ${{ inputs.profile }}
        run: |
          eas build --platform ios --profile "$IOS_PROFILE" --local \
            --non-interactive --freeze-credentials --output "$RUNNER_TEMP/dnmusic.ipa"
          test -s "$RUNNER_TEMP/dnmusic.ipa"
      - name: Guardar IPA descargable
        id: artifact
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dnmusic-ios-${{ inputs.profile }}-${{ github.run_number }}
          path: ${{ runner.temp }}/dnmusic.ipa
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Guardar IPA como borrador de Release si artifacts no está disponible
        if: ${{ steps.artifact.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          IPA_RELEASE_TAG: ios-build-${{ github.run_id }}-${{ github.run_attempt }}
          IOS_PROFILE: ${{ inputs.profile }}
        run: |
          printf '%s\n' "IPA de iOS ($IOS_PROFILE), commit $GITHUB_SHA." \
            'Borrador generado porque GitHub Actions no pudo guardar el artifact.' \
            'Podés descargar el IPA desde Assets. No publicar este borrador como release de escritorio.' \
            > "$RUNNER_TEMP/ios-release-notes.md"
          gh release create "$IPA_RELEASE_TAG" "$RUNNER_TEMP/dnmusic.ipa#dnmusic.ipa" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "iOS · $IOS_PROFILE · $GITHUB_RUN_NUMBER" \
            --notes-file "$RUNNER_TEMP/ios-release-notes.md"
      - name: Resumen y ubicación del IPA
        id: storage
        env:
          IOS_PROFILE: ${{ inputs.profile }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
          IPA_RELEASE_TAG: ios-build-${{ github.run_id }}-${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "### IPA generado" >> "$GITHUB_STEP_SUMMARY"
          if [ "$ARTIFACT_OUTCOME" = success ]; then
            echo 'kind=artifact' >> "$GITHUB_OUTPUT"
            echo "Perfil: $IOS_PROFILE. Descargalo desde Artifacts de esta ejecución." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'kind=release' >> "$GITHUB_OUTPUT"
            echo "release=$IPA_RELEASE_TAG" >> "$GITHUB_OUTPUT"
            RELEASE_URL=$(gh release view "$IPA_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
            echo "Artifacts no disponible. Descargá el IPA desde el [borrador de Release]($RELEASE_URL)." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "La compilación corrió en GitHub macOS con EAS local." >> "$GITHUB_STEP_SUMMARY"
          echo "Un IPA production requiere TestFlight/App Store; preview sólo funciona en los iPhones del perfil de firma." >> "$GITHUB_STEP_SUMMARY"

  testflight:
    name: Enviar a TestFlight
    needs: [validar, compilar]
    if: ${{ !cancelled() && needs.validar.result == 'success' && inputs.testflight && inputs.profile == 'production' && (needs.compilar.result == 'success' || inputs.ipa_release != '') }}
    permissions:
      contents: write # GitHub exige escritura para consultar borradores de Release.
    runs-on: ubuntu-latest
    # EAS Submit puede seguir en cola más de 30 minutos después de recibir el IPA.
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: '24.3.0'
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Instalar dependencias
        run: npm ci
      - if: ${{ needs.compilar.outputs.ipa-storage == 'artifact' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dnmusic-ios-${{ inputs.profile }}-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa
      - name: Descargar IPA del borrador de Release
        if: ${{ inputs.ipa_release != '' || needs.compilar.outputs.ipa-storage == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          IPA_RELEASE_TAG: ${{ inputs.ipa_release || needs.compilar.outputs.ipa-release }}
        run: |
          gh release view "$IPA_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,name \
            | jq -e '.isDraft and (.name | startswith("iOS · production ·"))' > /dev/null
          mkdir -p "$RUNNER_TEMP/ipa"
          gh release download "$IPA_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern dnmusic.ipa --dir "$RUNNER_TEMP/ipa"
      - name: Preparar autenticación de App Store Connect
        env:
          IOS_PROFILE: ${{ inputs.profile }}
          SUBMIT_TESTFLIGHT: 'true'
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: node scripts/ci/ios.mjs prepare-submit
      - name: Subir el IPA con EAS Submit
        run: eas submit --platform ios --profile github --path "$RUNNER_TEMP/ipa/dnmusic.ipa" --non-interactive --wait
      - name: Borrar clave temporal
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/dnmusic-apple"
