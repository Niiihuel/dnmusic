# Servicio de resolución de música para desarrollo local.
#
# Supabase se levanta aparte con `npx supabase start` (su propio stack de
# contenedores). Esto es solo el servicio de música, que necesita Node + jsdom
# y por eso no puede vivir en el cliente.
#
#   docker compose up --build music
#
services:
  music:
    build: ./server
    ports:
      - '8787:8787'
    environment:
      PORT: 8787
      # host.docker.internal para alcanzar el Supabase local desde el contenedor.
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:54321}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      AUDIO_BUCKET: songs
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:8081}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
